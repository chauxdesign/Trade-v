  <style>
    :root {
      --bg: #eceff3;
      --wire: #d1d5db;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e8ecf1;
      --panel: #fff;
      --card-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
      --card-radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .app {
      display: grid;
      grid-template-columns: 250px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    .wb-sidebar-frame {
      width: 250px;
      height: 100vh;
      border: none;
      display: block;
    }

    .wb-topbar-frame {
      width: 100%;
      height: 80px;
      border: none;
      display: block;
      flex-shrink: 0;
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .scroll-wrap {
      flex: 1;
      overflow: auto;
      padding: 12px 14px 24px;
      background: var(--bg);
    }

    .page-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }

    .table-wrap {
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 1680px;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #f1f5f9;
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
      color: #64748b;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:hover td { background: #f8fbff; }

    .col-sid {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }

    .sid-link {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
    }

    .sid-link:hover { text-decoration: underline; }

    td.col-record {
      white-space: normal;
      min-width: 180px;
      max-width: 240px;
      line-height: 1.5;
      color: #475569;
    }

    th.col-action,
    td.col-action {
      position: sticky;
      right: 0;
      z-index: 2;
      white-space: nowrap;
      width: 1%;
      min-width: max-content;
      padding-left: 14px;
      padding-right: 12px;
      border-left: 2px solid #bfdbfe;
      background: linear-gradient(90deg, #eef2ff 0, #eef2ff 10px, #fff 32px);
      box-shadow: -10px 0 18px rgba(37, 99, 235, 0.1);
    }

    th.col-action::before,
    td.col-action::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #94a3b8;
      pointer-events: none;
    }

    th.col-action {
      z-index: 4;
      border-left-color: #93c5fd;
      background: linear-gradient(90deg, #dbeafe 0, #dbeafe 10px, #f8fafc 32px);
      box-shadow: -10px 0 18px rgba(37, 99, 235, 0.12);
    }

    tr:hover td.col-action {
      background: linear-gradient(90deg, #dbeafe 0, #dbeafe 10px, #f8fbff 32px);
    }

    .action-links {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .action-link {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      font-size: 12px;
    }

    .action-link:hover { text-decoration: underline; }

    .table-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--muted);
      background: #fafbfc;
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .table-foot-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .table-pager-info { white-space: nowrap; }

    .table-pager-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pager-btn,
    .pager-page {
      border: 1px solid var(--wire);
      background: #fff;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      color: #374151;
      font-family: inherit;
      line-height: 1.2;
    }

    .pager-btn:hover,
    .pager-page:hover {
      border-color: #93c5fd;
      background: #f8fafc;
    }

    .pager-btn:disabled,
    .pager-page:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      background: #f8fafc;
    }

    .pager-page.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
      font-weight: 700;
    }

    .pager-ellipsis { padding: 0 4px; color: #94a3b8; }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      .wb-sidebar-frame {
        width: 100%;
        height: 40vh;
      }
    }
  </style>
</head>

  function getPageRows(page) {
    var start = (page - 1) * PAGE_SIZE;
    return CUSTOMER_DATA.slice(start, start + PAGE_SIZE);
  }

  function buildPageNumbers(totalPages, page) {
    var pages = [];
    if (totalPages <= 7) {
      for (var i = 1; i <= totalPages; i += 1) pages.push(i);
      return pages;
    }
    pages.push(1);
    if (page > 3) pages.push('...');
    var start = Math.max(2, page - 1);
    var end = Math.min(totalPages - 1, page + 1);
    for (var j = start; j <= end; j += 1) pages.push(j);
    if (page < totalPages - 2) pages.push('...');
    pages.push(totalPages);
    return pages;
  }

  function renderPagination(totalPages, page, total) {
    var info = document.getElementById('customerPagerInfo');
    var actions = document.getElementById('customerPagerActions');
    var start = total ? (page - 1) * PAGE_SIZE + 1 : 0;
    var end = Math.min(page * PAGE_SIZE, total);
    info.textContent = '共 ' + total + ' 条 · 第 ' + start + '-' + end + ' 条 · 每页 ' + PAGE_SIZE + ' 条';
    if (!total) {
      actions.innerHTML = '';
      return;
    }
    var html = '<button type="button" class="pager-btn" onclick="goToCustomerPage(' + (page - 1) + ')"' + (page <= 1 ? ' disabled' : '') + '>上一页</button>';
    buildPageNumbers(totalPages, page).forEach(function (item) {
      if (item === '...') {
        html += '<span class="pager-ellipsis">...</span>';
        return;
      }
      html += '<button type="button" class="pager-page' + (item === page ? ' active' : '') + '" onclick="goToCustomerPage(' + item + ')">' + item + '</button>';
    });
    html += '<button type="button" class="pager-btn" onclick="goToCustomerPage(' + (page + 1) + ')"' + (page >= totalPages ? ' disabled' : '') + '>下一页</button>';
    actions.innerHTML = html;
  }

  function goToCustomerPage(page) {
    var totalPages = Math.max(1, Math.ceil(CUSTOMER_DATA.length / PAGE_SIZE));
    currentPage = Math.min(Math.max(page || 1, 1), totalPages);
    renderCustomerTable();
  }

  function renderCustomerTable() {
    var tbody = document.getElementById('customerTableBody');
    var total = CUSTOMER_DATA.length;
    var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    var pageRows = getPageRows(currentPage);
    tbody.innerHTML = pageRows.map(renderCustomerRow).join('');
    renderPagination(totalPages, currentPage, total);
  }

  renderCustomerTable();
</script>
</body>
</html>
