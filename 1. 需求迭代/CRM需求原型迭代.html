<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../" />
  <title>CRM需求原型迭代</title>
  <style>
    :root {
      --bg: #eceff3;
      --sidebar: #f0f2f5;
      --sidebar-border: #e5e7eb;
      --menu-text: #333333;
      --menu-muted: #6b7280;
      --menu-icon: #4b5563;
      --menu-hover: #f5f7fa;
      --menu-active-bg: #eff6ff;
      --menu-active-text: #2563eb;
      --submenu-bg: #ffffff;
      --wire: #d1d5db;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e8ecf1;
      --panel: #fff;
      --card-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
      --card-radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .app {
      display: grid;
      grid-template-columns: 250px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    .wb-sidebar-frame {
      width: 250px;
      height: 100vh;
      border: none;
      display: block;
    }

    .wb-topbar-frame {
      width: 100%;
      height: 80px;
      border: none;
      display: block;
      flex-shrink: 0;
    }

    /* 主区域 */
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      position: relative;
    }

    .scroll-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 24px;
      background: var(--bg);
    }

    .content-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 48px 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .content-panel-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: #eff6ff;
      color: #2563eb;
      display: grid;
      place-items: center;
      font-size: 22px;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      .wb-sidebar-frame {
        width: 100%;
        height: 40vh;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <iframe class="wb-sidebar-frame" src="1. 需求迭代/_sidebar-menu.html#active=q2-sales-region" title="侧边菜单"></iframe>

  <main class="main">
    <iframe class="wb-topbar-frame" src="1. 需求迭代/_topbar.html#active=q2-sales-region" title="顶部导航"></iframe>

    <div class="scroll-wrap">
      <div class="content-panel" id="contentPanel">
        <div class="content-panel-icon">◎</div>
        <span id="placeholderText">「销售角色多国家地区改造需求」原型内容待补充</span>
      </div>
    </div>
  </main>
</div>

<script>
  (function () {
    var placeholderText = document.getElementById('placeholderText');
    var sidebarFrame = document.querySelector('.wb-sidebar-frame');
    var topbarFrame = document.querySelector('.wb-topbar-frame');

    var REQ_CONTENT = {
      'q2-sales-region': '销售角色多国家地区改造需求',
      'q2-private-chat': '私聊群发新增手数需求'
    };

    function getActiveId() {
      var hash = window.location.hash.replace(/^#/, '');
      var params = new URLSearchParams(hash);
      return params.get('active') || 'q2-sales-region';
    }

    function setContent(itemTitle) {
      placeholderText.textContent = '「' + itemTitle + '」原型内容待补充';
    }

    function syncFromHash() {
      var activeId = getActiveId();
      var itemTitle = REQ_CONTENT[activeId] || REQ_CONTENT['q2-sales-region'];
      setContent(itemTitle);
      if (sidebarFrame) {
        sidebarFrame.src = '1. 需求迭代/_sidebar-menu.html#active=' + encodeURIComponent(activeId);
      }
      if (topbarFrame) {
        topbarFrame.src = '1. 需求迭代/_topbar.html#active=' + encodeURIComponent(activeId);
      }
    }

    syncFromHash();
    window.addEventListener('hashchange', syncFromHash);
  })();
</script>
</body>
</html>
